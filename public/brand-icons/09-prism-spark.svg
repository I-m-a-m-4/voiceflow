<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-09" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141419"/>
      <stop offset="100%" stop-color="#08080A"/>
    </linearGradient>

    <!-- Prism Facet 1 -->
    <linearGradient id="facet-09-a" x1="256" y1="120" x2="384" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>

    <!-- Prism Facet 2 -->
    <linearGradient id="facet-09-b" x1="128" y1="200" x2="256" y2="384" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5500"/>
      <stop offset="100%" stop-color="#B82E00"/>
    </linearGradient>

    <!-- Prism Facet 3 -->
    <linearGradient id="facet-09-c" x1="256" y1="120" x2="128" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFB366"/>
      <stop offset="100%" stop-color="#FF771A"/>
    </linearGradient>
  </defs>

  <!-- App Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg-09)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Geometric Hexagonal Acoustic Prism -->
  <!-- Top Face -->
  <polygon points="256,128 368,192 256,256 144,192" fill="url(#facet-09-c)"/>

  <!-- Right Face -->
  <polygon points="256,256 368,192 368,320 256,384" fill="url(#facet-09-a)"/>

  <!-- Left Face -->
  <polygon points="144,192 256,256 256,384 144,320" fill="url(#facet-09-b)"/>

  <!-- Soundwave Laser Refraction Lines emanating from the Prism -->
  <path d="M 256 256 L 396 230" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <path d="M 256 256 L 416 256" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <path d="M 256 256 L 396 282" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>

  <!-- Equalizer notches etched on Prism's right flank -->
  <line x1="300" y1="260" x2="300" y2="330" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <line x1="324" y1="240" x2="324" y2="310" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <line x1="348" y1="220" x2="348" y2="290" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>

  <!-- AI Nova Sparkle at the Apex -->
  <path d="M 256 76 Q 256 100 280 100 Q 256 100 256 124 Q 256 100 232 100 Q 256 100 256 76 Z"
        fill="#FFFFFF"/>
</svg>
