<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bg-05" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5B00"/>
      <stop offset="100%" stop-color="#CC3700"/>
    </linearGradient>

    <!-- Floating Widget Pill Surface -->
    <linearGradient id="pill-bg-05" x1="96" y1="180" x2="416" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#24242A"/>
      <stop offset="100%" stop-color="#121216"/>
    </linearGradient>

    <!-- Pill Border -->
    <linearGradient id="pill-stroke-05" x1="96" y1="180" x2="416" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Shadow for Floating Effect -->
    <radialGradient id="shadow-05" cx="256" cy="390" r="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#551200" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#551200" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- App Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg-05)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2"/>

  <!-- Levitating Shadow underneath -->
  <ellipse cx="256" cy="380" rx="140" ry="24" fill="url(#shadow-05)"/>

  <!-- Levitating Widget Pill Capsule -->
  <rect x="96" y="180" width="320" height="152" rx="76" fill="url(#pill-bg-05)"/>
  <rect x="96" y="180" width="320" height="152" rx="76" stroke="url(#pill-stroke-05)" stroke-width="4"/>

  <!-- Left: Stealth Mode Indicator (Glowing Emerald Shield/Dot) -->
  <circle cx="156" cy="256" r="22" fill="#10B981" fill-opacity="0.2"/>
  <circle cx="156" cy="256" r="10" fill="#10B981"/>

  <!-- Center: Dynamic Voice Waves -->
  <g fill="#FFFFFF">
    <rect x="204" y="244" width="8" height="24" rx="4"/>
    <rect x="222" y="230" width="8" height="52" rx="4"/>
    <rect x="240" y="216" width="8" height="80" rx="4"/>
    <rect x="258" y="222" width="8" height="68" rx="4"/>
    <rect x="276" y="236" width="8" height="40" rx="4"/>
  </g>

  <!-- Right: AI Trigger Starburst (Live Answers Prompt) -->
  <circle cx="340" cy="256" r="28" fill="#FF5500"/>
  <path d="M 340 242 Q 340 256 354 256 Q 340 256 340 270 Q 340 256 326 256 Q 340 256 340 242 Z" fill="#FFFFFF"/>
</svg>
