<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-03" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141419"/>
      <stop offset="100%" stop-color="#09090C"/>
    </linearGradient>

    <!-- Liquid Ribbon Gradient 1 -->
    <linearGradient id="ribbon-03-a" x1="120" y1="120" x2="390" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9500"/>
      <stop offset="50%" stop-color="#FF5500"/>
      <stop offset="100%" stop-color="#E6004C"/>
    </linearGradient>

    <!-- Ribbon Gradient 2 -->
    <linearGradient id="ribbon-03-b" x1="380" y1="140" x2="160" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FF2A55"/>
    </linearGradient>

    <radialGradient id="center-glow-03" cx="256" cy="256" r="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5500" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FF5500" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- App Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg-03)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="256" cy="256" r="160" fill="url(#center-glow-03)"/>

  <!-- Infinity 'V' Ribbon: Left Loop & Ascent -->
  <path d="M 140 180 
           C 140 130 200 130 230 180 
           L 256 220 
           L 282 180 
           C 312 130 372 130 372 180 
           C 372 240 310 310 256 376 
           C 202 310 140 240 140 180 Z" 
        stroke="url(#ribbon-03-a)" 
        stroke-width="32" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="none"/>

  <!-- Overlapping Flow Wave (gives 3D ribbon depth) -->
  <path d="M 186 160 
           C 216 140 240 160 256 190 
           C 272 160 296 140 326 160
           C 356 180 348 230 312 280 
           L 256 348 
           L 200 280
           C 164 230 156 180 186 160 Z"
        stroke="url(#ribbon-03-b)"
        stroke-width="12"
        stroke-linecap="round"
        fill="none"
        stroke-opacity="0.7"/>

  <!-- Sound Node Particles -->
  <circle cx="256" cy="376" r="10" fill="#FFFFFF"/>
  <circle cx="140" cy="180" r="8" fill="#FFC085"/>
  <circle cx="372" cy="180" r="8" fill="#FFC085"/>
</svg>
