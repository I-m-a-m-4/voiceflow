  <!-- App Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg-06)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Concentric Acoustic Waves (Orbital Radar) -->
  <circle cx="256" cy="256" r="168" stroke="#FF5500" stroke-opacity="0.12" stroke-width="4"/>
  <circle cx="256" cy="256" r="136" stroke="#FF5500" stroke-opacity="0.25" stroke-width="6" stroke-dasharray="14 12"/>
  <circle cx="256" cy="256" r="104" stroke="#FF771A" stroke-opacity="0.5" stroke-width="8"/>
  <circle cx="256" cy="256" r="76" stroke="#FFA34D" stroke-opacity="0.8" stroke-width="10" stroke-dasharray="16 10"/>

  <!-- Glowing Neural Center Node -->
  <circle cx="256" cy="256" r="46" fill="url(#core-glow-06)"/>
  <circle cx="256" cy="256" r="46" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Central Audio Wave Lines -->
  <rect x="238" y="244" width="6" height="24" rx="3" fill="#FFFFFF"/>
  <rect x="253" y="232" width="6" height="48" rx="3" fill="#FFFFFF"/>
  <rect x="268" y="244" width="6" height="24" rx="3" fill="#FFFFFF"/>

  <!-- Satellite Co-Pilot Signals (Microphone & System Audio Nodes) -->
  <circle cx="160" cy="180" r="10" fill="#FF771A"/>
  <circle cx="352" cy="180" r="10" fill="#FF771A"/>
  <circle cx="256" cy="88" r="8" fill="#FFFFFF"/>
  <circle cx="256" cy="424" r="8" fill="#FF5500"/>
