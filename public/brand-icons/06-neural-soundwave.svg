<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-06" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A1821"/>
      <stop offset="100%" stop-color="#0E0D12"/>
    </linearGradient>

    <linearGradient id="core-glow-06" x1="256" y1="180" x2="256" y2="332" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFA84A"/>
      <stop offset="50%" stop-color="#FF5500"/>
      <stop offset="100%" stop-color="#D83000"/>
