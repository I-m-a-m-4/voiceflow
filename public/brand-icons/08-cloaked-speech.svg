<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bg-08" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181F"/>
      <stop offset="100%" stop-color="#0E0E14"/>
    </linearGradient>

    <!-- Bubble Gradient -->
    <linearGradient id="bubble-grad-08" x1="120" y1="120" x2="390" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF751A"/>
      <stop offset="60%" stop-color="#FF5500"/>
      <stop offset="100%" stop-color="#E03A00"/>
    </linearGradient>

    <!-- Wave Glow -->
    <linearGradient id="wave-08" x1="200" y1="200" x2="312" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFE0CC"/>
    </linearGradient>
  </defs>

  <!-- App Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg-08)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Cloaked Speech Bubble Body -->
  <path d="M 120 236 
           C 120 162 176 112 256 112 
           C 336 112 392 162 392 236 
           C 392 310 336 360 256 360 
           C 228 360 200 352 178 338 
           L 126 368 
           L 138 318 
           C 126 294 120 266 120 236 Z" 
        fill="url(#bubble-grad-08)"/>

  <!-- Stealth Cloak Visor Cutout / Brow Accent -->
  <path d="M 160 200 C 210 224 302 224 352 200" 
        stroke="#FFFFFF" 
        stroke-opacity="0.3" 
        stroke-width="6" 
        stroke-linecap="round"/>

  <!-- Soundwave Equalizer inside the Bubble -->
  <g fill="url(#wave-08)">
    <rect x="200" y="240" width="12" height="32" rx="6"/>
    <rect x="224" y="222" width="12" height="68" rx="6"/>
    <rect x="248" y="210" width="12" height="92" rx="6"/>
    <rect x="272" y="222" width="12" height="68" rx="6"/>
    <rect x="296" y="240" width="12" height="32" rx="6"/>
  </g>

  <!-- Secret Stealth Lock / Dot -->
  <circle cx="380" cy="128" r="14" fill="#10B981"/>
  <circle cx="380" cy="128" r="22" stroke="#10B981" stroke-opacity="0.4" stroke-width="3"/>
</svg>
