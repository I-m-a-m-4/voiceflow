<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bg-vf-10" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5D00"/>
      <stop offset="60%" stop-color="#FF4000"/>
      <stop offset="100%" stop-color="#D62B00"/>
    </linearGradient>

    <!-- Glass Surface Sheen -->
    <linearGradient id="sheen-vf-10" x1="0" y1="0" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Wave Glow -->
    <filter id="soft-glow-vf-10" x="100" y="100" width="312" height="312" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg-vf-10)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#sheen-vf-10)"/>

  <!-- Centered Precision Soundwave Bars -->
  <g fill="#FFFFFF" filter="url(#soft-glow-vf-10)">
    <rect x="144" y="234" width="22" height="44" rx="11"/>
    <rect x="188" y="196" width="22" height="120" rx="11"/>
    <rect x="232" y="152" width="22" height="208" rx="11"/>
    <rect x="276" y="206" width="22" height="100" rx="11"/>
    <rect x="320" y="244" width="22" height="24" rx="11"/>
    <rect x="364" y="234" width="22" height="44" rx="11"/>
  </g>

  <!-- Prominent AI Co-Pilot Starburst / Intelligence Diamond -->
  <path d="M 334 130 Q 334 164 368 164 Q 334 164 334 198 Q 334 164 300 164 Q 334 164 334 130 Z"
        fill="#FFFFFF"/>

  <!-- Secondary Satellite Spark -->
  <circle cx="156" cy="180" r="7" fill="#FFFFFF" fill-opacity="0.75"/>
</svg>
