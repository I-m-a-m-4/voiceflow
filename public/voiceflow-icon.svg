<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Orange Background Gradient -->
  <defs>
    <linearGradient id="vf-bg-orange" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="50%" stop-color="#FF5500"/>
      <stop offset="100%" stop-color="#D94000"/>
    </linearGradient>
    <linearGradient id="vf-sheen" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Icon Rounded Canvas -->
  <rect width="512" height="512" rx="120" fill="url(#vf-bg-orange)"/>
  <rect width="512" height="512" rx="120" fill="url(#vf-sheen)"/>

  <!-- Logo Content: White Voice AI Soundwave Bubble -->
  <g fill="#FFFFFF">
    <!-- Soundwave Equalizer Bars -->
    <rect x="160" y="236" width="20" height="40" rx="10"/>
    <rect x="204" y="196" width="20" height="120" rx="10"/>
    <rect x="248" y="156" width="20" height="200" rx="10"/>
    <rect x="292" y="196" width="20" height="120" rx="10"/>
    <rect x="336" y="236" width="20" height="40" rx="10"/>

    <!-- Acoustic Sound Wave Accent Arcs -->
    <path d="M 120 200 C 100 230 100 282 120 312" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" fill="none"/>
    <path d="M 392 200 C 412 230 412 282 392 312" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" fill="none"/>

    <!-- Sparkle / AI Note Highlight -->
    <path d="M 380 130 Q 380 150 400 150 Q 380 150 380 170 Q 380 150 360 150 Q 380 150 380 130 Z"/>
  </g>
</svg>
